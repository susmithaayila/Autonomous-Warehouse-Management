apiVersion: apps/v1
kind: Deployment
metadata:
  name: awms-deployment
  namespace: awms-prod
  labels:
    app: awms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: awms
  template:
    metadata:
      labels:
        app: awms
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: awms-backend
        image: awms:v1.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        envFrom:
        - configMapRef:
            name: awms-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: awms-secret
              key: SECRET_KEY
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
